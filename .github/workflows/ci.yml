name: CI

# Tiered for Actions minutes. Every push: lint, types and tests on one Python. Big checks (all Pythons, Godot) run on
# the PR once it leaves draft (PRs stay drafts while in development and review), and again only if a commit lands
# after that: the last gate before merge. Run workflow runs everything. A vX.Y.Z tag only runs the release job.
on:
  push:
    branches: ["**"]
    tags: ["v*.*.*"]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')) || (github.event_name == 'pull_request' && !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # one Python on a push; all three before merge
        python-version: ${{ fromJSON(github.event_name == 'push' && '["3.12"]' || '["3.11", "3.12", "3.13"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Version
        run: kiln --version
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy
      - name: Tests
        run: pytest -q
      - name: Lint the demo
        working-directory: examples/demo
        run: kiln lint

  godot:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && !github.event.pull_request.draft)
    # Builds the demo into the example Godot project twice (deterministic), loads everything in headless Godot and
    # runs the showcase scene.
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: "4.7.2-stable"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}
      - name: Download Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -sSL -o ~/godot/godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q ~/godot/godot.zip -d ~/godot
          rm ~/godot/godot.zip
      - name: Point GODOT at the binary
        run: |
          chmod +x ~/godot/Godot_v${GODOT_VERSION}_linux.x86_64
          echo "GODOT=$HOME/godot/Godot_v${GODOT_VERSION}_linux.x86_64" >> "$GITHUB_ENV"
      - name: Build the demo twice (deterministic) and verify in Godot
        working-directory: examples/demo
        run: |
          kiln build --verify-godot
          cp -r ../godot/assets/kiln /tmp/first
          rm -rf .kiln-cache
          kiln build
          diff -r /tmp/first ../godot/assets/kiln
      - name: Showcase scene
        run: |
          # a fresh checkout has no import cache (.godot/ is ignored): import first, or the glbs don't load
          $GODOT --headless --path examples/godot --import
          $GODOT --headless --path examples/godot -s res://tests/check_showcase.gd
      - name: Godot tests
        run: pytest -q -k godot

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver="${GITHUB_REF_NAME#v}"
          awk -v v="$ver" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md >notes.md
          [ -s notes.md ] || { echo "CHANGELOG.md has no section for $ver"; exit 1; }
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md
