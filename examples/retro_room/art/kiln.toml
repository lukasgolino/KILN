# Retro room (#362): nine objects for a walkable demo of the retro looks. `kiln config show` lists every setting.
default_style = "retro_st"       # kiln style list; or your own in styles/<name>.style.toml
default_palette = "main"       # palettes/main.pal.yaml (PAGAN's palette format); models use its colour names
output_dir = "../godot/assets/kiln"
preview_dir = "previews"
export = ["glb", "godot"]
looks = ["retro_st", "retro_cga", "retro_mono"]  # the room switches between them: 1 / 2 / 3
style_version = 1              # `kiln style bump` raises it when the look changes; models record theirs

[lint]
disable = []                   # warnings to turn off project-wide, e.g. ["W106"]
