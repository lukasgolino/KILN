[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kiln"
version = "0.15.0"
description = "KILN (Keyed Implicit Language & Notation): write smooth stylised 3D models as text, build them into game-ready glTF."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Lukas Golino" }]
requires-python = ">=3.11"
dependencies = [
    "Pillow>=10.1",
    "PyYAML>=6",
    "numpy>=1.26",
    "fast-simplification>=0.2.0",
    "fonttools>=4.40",
]

[project.optional-dependencies]
dev = ["pytest>=8", "mypy>=1.10", "ruff>=0.15", "types-PyYAML", "mcp>=2.3,<3", "numba>=0.60"]
mcp = ["mcp>=2.3,<3"]
fast = ["numba>=0.60"]

[project.scripts]
kiln = "kiln.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kiln = ["py.typed", "styles/*", "templates/*", "skill/*", "skill/topics/*", "library/*", "recipes/*"]

[tool.mypy]
strict = true
files = ["src/kiln", "tests"]

[[tool.mypy.overrides]]
module = ["fast_simplification", "fontTools.*", "numba"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# numpy expressions on parameter dicts are Any to mypy; the shape functions return arrays by construction
module = ["kiln.sdf", "kiln.mesher", "kiln.paint", "kiln.render", "kiln.rig", "kiln.importer", "kiln.jit"]
warn_return_any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: benchmarks (a few seconds; deselect with -m 'not slow')"]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]  # long lines are fine; no formatter is enforced
