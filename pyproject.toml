[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kiln-gen"
version = "0.21.0"
description = "KILN (Keyed Implicit Language & Notation): write smooth stylised 3D models as text, build them into game-ready glTF."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Lukas Golino" }]
keywords = ["3d", "gltf", "godot", "sdf", "game-assets", "mcp", "procedural"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
]
requires-python = ">=3.11"
dependencies = [
    "Pillow>=10.1",
    "PyYAML>=6",
    "numpy>=1.26",
    "fast-simplification>=0.2.0",
    "fonttools>=4.40",
    "mcp>=2.3,<3",
]

[project.urls]
Homepage = "https://kiln3d.dev/"
Source = "https://github.com/lukasgolino/kiln"
Issues = "https://github.com/lukasgolino/kiln/issues"
Changelog = "https://github.com/lukasgolino/kiln/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8", "mypy>=1.10", "ruff>=0.15", "types-PyYAML", "numba>=0.60", "xatlas>=0.0.9"]
mcp = []  # kept (empty) so `kiln-gen[mcp]` still resolves; the MCP server is always installed now
bake = ["xatlas>=0.0.9"]
fast = ["numba>=0.60"]

[project.scripts]
kiln = "kiln.cli:main"
kiln-gen = "kiln.cli:main"  # so `uvx kiln-gen ...` (the MCP Registry entry) finds a command

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kiln = ["py.typed", "styles/*", "templates/*", "skill/*", "skill/topics/*", "library/*", "recipes/*"]

[tool.mypy]
strict = true
files = ["src/kiln", "tests"]

[[tool.mypy.overrides]]
module = ["fast_simplification", "fontTools.*", "numba", "xatlas"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# numpy expressions on parameter dicts are Any to mypy; the shape functions return arrays by construction
module = ["kiln.sdf", "kiln.mesher", "kiln.paint", "kiln.render", "kiln.rig", "kiln.importer", "kiln.jit", "kiln.bake"]
warn_return_any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: benchmarks (a few seconds; deselect with -m 'not slow')"]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]  # long lines are fine; no formatter is enforced
