name: $name
description: $description
class: character
status: draft
# A bean character: body, legs, arms, eyes. Metres; stands on y = 0; faces +Z. Edit shapes and colours, then
# `kiln preview $name` and LOOK at it.
parts:
  - capsule: { from: [0, 0.32, 0], to: [0, 0.72, 0], radius: 0.3 }
    color: red
    material: plastic
  - capsule: { from: [0.12, 0.1, 0], to: [0.12, 0.26, 0], radius: 0.1 }
    id: leg_l
    mirror: x
    mirror_id: leg_r
    blend: 0.05
    color: red
    material: plastic
  - capsule: { from: [0.3, 0.6, 0], to: [0.42, 0.38, 0.08], radius: 0.08 }
    id: arm_l
    mirror: x
    mirror_id: arm_r
    blend: 0.04
    color: red
    material: plastic
  - sphere: { at: [0.1, 0.82, 0.22], radius: 0.1 }
    mirror: x
    color: white
    material: plastic
  - sphere: { at: [0.11, 0.83, 0.31], radius: 0.042 }
    mirror: x
    color: black
    material: plastic
rig:
  leg_l: { pivot: [0.12, 0.26, 0] }
  arm_l: { pivot: [0.3, 0.6, 0] }
skin: soft
animations:
  walk: { fps: 12, cycle: { type: waddle } }
  idle: { fps: 6, cycle: { type: breathe, amount: 0.03 } }
